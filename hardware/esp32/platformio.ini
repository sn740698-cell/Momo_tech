; PlatformIO Project Configuration File for MOMO Physical ESP32 Companion
; Exact match for hardware: ESP32 DevKit V1, SSD1306, SG90, MAX98357A, 3x Buttons

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1
    olikraus/U8g2 @ ^2.35.9
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MOMO_DEVICE_ID=\"momo-01\"
